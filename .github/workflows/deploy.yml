name: Deploy naar rwwbouw.nl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + git pull op Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configureer SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' vangt het geval af dat de secret als CRLF is geplakt.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Falen we hier, dan is de DEPLOY_SSH_KEY secret zelf corrupt — re-paste.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY secret is geen geldige private key. Re-paste vanuit je password manager (let op: hele blok inclusief BEGIN/END regels en trailing newline)."
            exit 1
          fi

      - name: Deploy (fast-forward pull + PHP lint)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "== Voor pull =="
          git rev-parse --short HEAD

          # Hotfix-bescherming: snapshot CMS-state (data/*.json) voor de pull, zodat
          # GTM-id, content, branding etc. nooit overschreven worden door git pull.
          # Structurele fix komt in de cutover naar composer + untracked data/ (spec
          # 2026-05-23-easeo-cms-cicd-en-update-flow-design).
          SNAPSHOT="/tmp/rww-data-snapshot-$$"
          mkdir -p "$SNAPSHOT"
          if compgen -G "data/*.json" > /dev/null; then
            cp -f data/*.json "$SNAPSHOT/"
            echo "Snapshot van $(ls data/*.json | wc -l) JSON-files in $SNAPSHOT"
          else
            echo "Geen data/*.json gevonden (eerste run?), geen snapshot."
          fi

          git fetch origin main

          if ! git merge --ff-only origin/main; then
            echo "::error::Fast-forward merge faalde. Live state wordt hersteld."
            git status
            # Restore voor de zekerheid (mocht git toch iets aangeraakt hebben)
            if [ -d "$SNAPSHOT" ] && compgen -G "$SNAPSHOT/*.json" > /dev/null; then
              cp -f "$SNAPSHOT"/*.json data/
            fi
            rm -rf "$SNAPSHOT"
            exit 1
          fi

          # Restore CMS-state na de pull. Overschrijft alleen de geünifyde set
          # JSON-files; nieuwe files die de pull eventueel toevoegt blijven staan.
          if compgen -G "$SNAPSHOT/*.json" > /dev/null; then
            cp -f "$SNAPSHOT"/*.json data/
            echo "$(ls $SNAPSHOT/*.json | wc -l) JSON-files hersteld uit snapshot."
          fi
          rm -rf "$SNAPSHOT"

          echo "== Na pull =="
          git rev-parse --short HEAD

          echo "== PHP syntax check =="
          CHANGED=$(git diff --name-only HEAD@{1} HEAD -- '*.php' || true)
          for f in $CHANGED index.php form-handler.php router.php; do
            [ -f "$f" ] || continue
            php -l "$f" >/dev/null
          done
          echo "Alle PHP-bestanden syntactisch OK."
          REMOTE

      - name: Smoke test (HTTP 200 + GTM aanwezig)
        run: |
          BODY=$(curl -fsS https://www.rwwbouw.nl/)
          echo "$BODY" | grep -q "googletagmanager.com/gtm.js" \
            || { echo "::error::GTM script niet meer aanwezig in homepage HTML — CMS-state ging mogelijk verloren"; exit 1; }
          GTM_ID=$(echo "$BODY" | grep -oE "GTM-[A-Z0-9]+" | head -1 || echo "(geen ID gevonden)")
          echo "Homepage HTTP 200 — GTM ID: $GTM_ID"
